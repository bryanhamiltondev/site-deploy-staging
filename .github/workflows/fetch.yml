name: fetch-site
on: push
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch file and record hash
        run: |
          curl -sL --max-time 60 "https://app.littlebird.ai/f/36e9cb5e-2e64-4ba5-8e28-732fd8ab2e3b" -o fetched.html
          wc -c fetched.html | tee size.txt
          sha256sum fetched.html | tee sha.txt
          if head -c 15 fetched.html | grep -q ""; then
            cp fetched.html index.html
            git rm -f --ignore-unmatch p1.txt p2.txt p3.txt p4.txt p5.txt p6.txt p7.txt fetched.html
            git add index.html sha.txt size.txt
            git -c user.name=fetch-bot -c user.email=bot@users.noreply.github.com (mailto:bot@users.noreply.github.com) commit -m "Fetch index.html"
            git push
          else
            git rm -f --ignore-unmatch p1.txt p2.txt p3.txt p4.txt p5.txt p6.txt p7.txt fetched.html
            git add sha.txt size.txt
            git -c user.name=fetch-bot -c user.email=bot@users.noreply.github.com (mailto:bot@users.noreply.github.com) commit -m "Fetch failed - diagnostics in sha.txt"
            git push
          fi
