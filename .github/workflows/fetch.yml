name: fetch-site
on: push
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch from s3url.txt and verify
        run: |
          set +e
          URL=$(cat s3url.txt)
          curl -sL --max-time 60 "$URL" -o fetched.html
          echo curl_exit=$? > diag.txt
          wc -c fetched.html >> diag.txt 2>&1
          sha256sum fetched.html > sha.txt 2>&1
          echo expected=7e612b5df99abead48d2d9b7b4262f8aaf65c0e7bb838ad47c59f503b77bdfc5 >> sha.txt
          if sha256sum fetched.html | grep -q 7e612b5df99abead48d2d9b7b4262f8aaf65c0e7bb838ad47c59f503b77bdfc5; then
            cp fetched.html index.html
            echo MATCH >> diag.txt
          else
            echo NOMATCH >> diag.txt
          fi
          git rm -f --ignore-unmatch p1.txt p2.txt p3.txt p4.txt p5.txt p6.txt p7.txt fetched.html s3url.txt
          git add -A
          git -c user.name=fetch-bot -c user.email=fetch-bot commit -m fetch-run
          git push
